<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>BeatStream — Music Streaming App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0b0b1a, #1a1a2e);
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .player {
            max-width: 550px;
            width: 100%;
            background: rgba(15, 15, 30, 0.75);
            backdrop-filter: blur(16px);
            border-radius: 2rem;
            padding: 1.5rem;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5);
            color: white;
            transition: all 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Logo + App Header */
        .app-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 1.2rem;
            border-bottom: 1px solid rgba(255, 140, 0, 0.4);
            padding-bottom: 0.7rem;
        }

        .logo-svg {
            width: 40px;
            height: 40px;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.3));
        }

        .app-title {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ff8c00, #ffcc00);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }

        .app-sub {
            font-size: 0.7rem;
            opacity: 0.7;
            margin-left: auto;
        }

        .cover {
            text-align: center;
            margin-top: 0.5rem;
        }

        .cover img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 1.5rem;
            box-shadow: 0 20px 30px rgba(0, 0, 0, 0.5);
            margin-bottom: 1rem;
        }

        .song-info {
            text-align: center;
            margin: 0.5rem 0 1rem;
        }

        .song-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.3rem;
        }

        .artist {
            opacity: 0.8;
            font-size: 0.9rem;
        }

        .progress-area {
            margin: 1rem 0;
        }

        .progress-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.8rem;
        }

        input[type="range"] {
            flex: 1;
            height: 5px;
            -webkit-appearance: none;
            background: rgba(255,255,255,0.2);
            border-radius: 5px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: #ff8c00;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 4px white;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin: 1rem 0;
        }

        .ctrl-btn {
            background: rgba(255,255,255,0.12);
            border: none;
            font-size: 1.7rem;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }

        .ctrl-btn.play {
            background: #ff8c00;
            font-size: 2rem;
            box-shadow: 0 5px 15px rgba(255,140,0,0.5);
        }

        .ctrl-btn:hover {
            transform: scale(1.05);
            background: rgba(255,255,255,0.25);
        }

        .volume {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin: 0.8rem 0;
        }

        .playlist {
            margin-top: 1.2rem;
            border-top: 1px solid rgba(255,255,255,0.15);
            padding-top: 1rem;
            max-height: 260px;
            overflow-y: auto;
        }

        .playlist h3 {
            font-size: 1rem;
            margin-bottom: 0.6rem;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .playlist ul {
            list-style: none;
        }

        .playlist li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.6rem 0.8rem;
            background: rgba(255,255,255,0.06);
            margin-bottom: 0.5rem;
            border-radius: 14px;
            cursor: pointer;
            transition: 0.1s;
        }

        .playlist li:hover, .playlist .active-track {
            background: #ff8c00;
            color: white;
        }

        .track-name {
            font-weight: 500;
            font-size: 0.9rem;
        }

        .track-artist {
            font-size: 0.7rem;
            opacity: 0.7;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #2a2a3b;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #ff8c00;
            border-radius: 4px;
        }

        @media (max-width: 500px) {
            .player {
                padding: 1.2rem;
            }
            .cover img {
                width: 160px;
                height: 160px;
            }
            .ctrl-btn {
                width: 48px;
                height: 48px;
                font-size: 1.4rem;
            }
            .app-title {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>

<div class="player">
    <!-- HEADER WITH LOGO & NAME -->
    <div class="app-header">
        <svg class="logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Music note + wave combining BeatStream identity -->
            <circle cx="50" cy="50" r="48" fill="url(#grad1)" stroke="#ff8c00" stroke-width="1.5"/>
            <defs>
                <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#ff8c00" />
                    <stop offset="100%" stop-color="#ffcc00" />
                </linearGradient>
            </defs>
            <!-- Music note stem -->
            <rect x="44" y="28" width="6" height="38" rx="2" fill="white" />
            <!-- Note head -->
            <ellipse cx="55" cy="66" rx="12" ry="9" fill="white" />
            <!-- Sound wave lines -->
            <path d="M68 38 Q74 46 68 54" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <path d="M74 30 Q84 46 74 62" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.8"/>
            <!-- Small star / beat -->
            <circle cx="34" cy="44" r="3" fill="white" />
        </svg>
        <span class="app-title">BeatStream</span>
        <span class="app-sub">🎵 stream the beat</span>
    </div>

    <div class="cover">
        <img id="coverImg" src="https://picsum.photos/id/104/300/300" alt="cover">
    </div>
    <div class="song-info">
        <div class="song-title" id="songTitle">Select a song</div>
        <div class="artist" id="artistName">Artist</div>
    </div>

    <div class="progress-area">
        <div class="progress-bar">
            <span id="currentTime">0:00</span>
            <input type="range" id="progressSlider" value="0" step="0.01">
            <span id="duration">0:00</span>
        </div>
    </div>

    <div class="controls">
        <button class="ctrl-btn" id="prevBtn">⏮</button>
        <button class="ctrl-btn play" id="playPauseBtn">▶</button>
        <button class="ctrl-btn" id="nextBtn">⏭</button>
    </div>

    <div class="volume">
        <span>🔊</span>
        <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.8">
    </div>

    <div class="playlist">
        <h3>📀 BeatStream Playlist</h3>
        <ul id="playlistContainer"></ul>
    </div>
</div>

<audio id="audioPlayer" preload="metadata"></audio>

<script>
    // ---------- ROYALTY-FREE TRACKS FOR BEATSTREAM ----------
    const songsList = [
        {
            title: "Neon Dreams",
            artist: "Electronic Vibes",
            cover: "https://picsum.photos/id/29/300/300",
            src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"
        },
        {
            title: "Midnight Drive",
            artist: "Lofi Beats",
            cover: "https://picsum.photos/id/42/300/300",
            src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"
        },
        {
            title: "Summer Breeze",
            artist: "Chill Pop",
            cover: "https://picsum.photos/id/96/300/300",
            src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3"
        },
        {
            title: "Retro Wave",
            artist: "Synthwave",
            cover: "https://picsum.photos/id/155/300/300",
            src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3"
        },
        {
            title: "Deep Focus",
            artist: "Ambient Study",
            cover: "https://picsum.photos/id/91/300/300",
            src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3"
        }
    ];

    // DOM elements
    const audio = document.getElementById('audioPlayer');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const progressSlider = document.getElementById('progressSlider');
    const currentTimeSpan = document.getElementById('currentTime');
    const durationSpan = document.getElementById('duration');
    const volumeSlider = document.getElementById('volumeSlider');
    const coverImg = document.getElementById('coverImg');
    const songTitleSpan = document.getElementById('songTitle');
    const artistNameSpan = document.getElementById('artistName');
    const playlistContainer = document.getElementById('playlistContainer');

    let currentTrackIndex = 0;
    let isPlaying = false;

    function loadTrack(index) {
        const track = songsList[index];
        if (!track) return;
        audio.src = track.src;
        songTitleSpan.innerText = track.title;
        artistNameSpan.innerText = track.artist;
        coverImg.src = track.cover;
        updateActivePlaylist();
        if (isPlaying) {
            audio.play().catch(e => console.log("Autoplay blocked? Click play."));
        }
    }

    function updateActivePlaylist() {
        const items = document.querySelectorAll('#playlistContainer li');
        items.forEach((li, i) => {
            if (i === currentTrackIndex) {
                li.classList.add('active-track');
            } else {
                li.classList.remove('active-track');
            }
        });
    }

    function renderPlaylist() {
        playlistContainer.innerHTML = '';
        songsList.forEach((song, idx) => {
            const li = document.createElement('li');
            li.innerHTML = `
                <div>
                    <div class="track-name">${song.title}</div>
                    <div class="track-artist">${song.artist}</div>
                </div>
                <div>🎧</div>
            `;
            li.addEventListener('click', () => {
                currentTrackIndex = idx;
                loadTrack(currentTrackIndex);
                playSong();
            });
            playlistContainer.appendChild(li);
        });
        updateActivePlaylist();
    }

    function playSong() {
        audio.play();
        isPlaying = true;
        playPauseBtn.innerHTML = '⏸';
    }

    function pauseSong() {
        audio.pause();
        isPlaying = false;
        playPauseBtn.innerHTML = '▶';
    }

    function nextTrack() {
        currentTrackIndex = (currentTrackIndex + 1) % songsList.length;
        loadTrack(currentTrackIndex);
        playSong();
    }

    function prevTrack() {
        currentTrackIndex = (currentTrackIndex - 1 + songsList.length) % songsList.length;
        loadTrack(currentTrackIndex);
        playSong();
    }

    function formatTime(seconds) {
        if (isNaN(seconds)) return "0:00";
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs < 10 ? '0' + secs : secs}`;
    }

    // Event listeners
    playPauseBtn.addEventListener('click', () => {
        if (isPlaying) pauseSong();
        else playSong();
    });

    prevBtn.addEventListener('click', prevTrack);
    nextBtn.addEventListener('click', nextTrack);

    audio.addEventListener('timeupdate', () => {
        if (audio.duration) {
            const percent = (audio.currentTime / audio.duration) * 100;
            progressSlider.value = percent;
            currentTimeSpan.innerText = formatTime(audio.currentTime);
        }
    });

    audio.addEventListener('loadedmetadata', () => {
        durationSpan.innerText = formatTime(audio.duration);
        progressSlider.max = 100;
    });

    audio.addEventListener('ended', nextTrack);

    progressSlider.addEventListener('input', (e) => {
        if (audio.duration) {
            const seekTime = (e.target.value / 100) * audio.duration;
            audio.currentTime = seekTime;
        }
    });

    volumeSlider.addEventListener('input', (e) => {
        audio.volume = e.target.value;
    });

    // Initialize
    renderPlaylist();
    loadTrack(0);
</script>
</body>
</html>
